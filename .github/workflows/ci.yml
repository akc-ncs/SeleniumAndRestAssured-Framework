name: Test Automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"   # nightly (UTC)

env:
  MAVEN_ARGS: "-B -ntp"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn $MAVEN_ARGS test -Dsuite=src/test/resources/suites/api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: allure-results-api, path: target/allure-results }

  ui-local-chrome:
    runs-on: ubuntu-latest          # Chrome is pre-installed; Selenium Manager fetches the driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn $MAVEN_ARGS test -Dsuite=src/test/resources/suites/ui.xml -Dbrowser=chrome -Dheadless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: allure-results-ui-local, path: target/allure-results }

  ui-lambdatest:
    runs-on: ubuntu-latest
    needs: [api-tests, ui-local-chrome]     # only spend cloud minutes once the cheap jobs pass
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chrome,  platform: "Windows 11" }
          - { browser: edge,    platform: "Windows 11" }
          - { browser: firefox, platform: "Windows 10" }
          - { browser: safari,  platform: "macOS Sonoma" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - name: Run on LambdaTest
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: >
          mvn $MAVEN_ARGS test
          -Dsuite=src/test/resources/suites/ui.xml
          -Dexecution=lambdatest
          -Dbrowser=${{ matrix.browser }}
          -Dlt.platform="${{ matrix.platform }}"
          -Dlt.build="gha-${{ github.run_number }}-${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-lt-${{ matrix.browser }}
          path: target/allure-results

  allure-report:
    runs-on: ubuntu-latest
    needs: [api-tests, ui-local-chrome, ui-lambdatest]
    if: always()
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: allure-results-*, path: allure-results, merge-multiple: true }
      - uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with: { ref: gh-pages, path: gh-pages }     # keeps report history/trends
      - uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20
      - uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
