# .github/workflows/ci.yml
# Runs entirely on GitHub-hosted runners: API tests + UI tests on headless Chrome.
# No LambdaTest here (that lives in lambdatest.yml), and no other browsers.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch/PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run API suite
        run: mvn -B -ntp test -Dsuite=src/test/resources/suites/api.xml

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-api
          path: target/allure-results
          if-no-files-found: ignore

  ui-chrome:
    name: UI tests (headless Chrome)
    runs-on: ubuntu-24.04            # Google Chrome is pre-installed on this image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show Chrome version
        run: google-chrome --version

      - name: Run UI suite on local headless Chrome
        run: >
          mvn -B -ntp test
          -Dsuite=src/test/resources/suites/ui.xml
          -Dexecution=local
          -Dbrowser=chrome
          -Dheadless=true
          -Dchrome.binary="$(command -v google-chrome)"

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-ui
          path: target/allure-results
          if-no-files-found: ignore

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-ui
          path: target/surefire-reports
          if-no-files-found: ignore

  report:
    name: Allure report
    needs: [api-tests, ui-chrome]
    if: ${{ !cancelled() }}          # build the report even when tests failed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5  # the Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v7
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate report
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report