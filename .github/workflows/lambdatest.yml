# Runs the UI suite on LambdaTest: Chrome, Edge and Safari in parallel (one TestNG <test> each).
name: LambdaTest Cross-Browser

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: "0 20 * * 1-5"        # weekday nights (UTC)
  workflow_dispatch:

# A newer run on the same ref cancels the older one so sessions don't pile up
# against your LambdaTest parallel-session limit.
concurrency:
  group: lambdatest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambdatest:
    runs-on: ubuntu-24.04
    environment: CI
    timeout-minutes: 30
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check LambdaTest credentials
        run: |
          if [ -z "$LT_USERNAME" ] || [ -z "$LT_ACCESS_KEY" ]; then
            echo "::error::LT_USERNAME / LT_ACCESS_KEY secrets are missing (PRs from forks do not receive secrets)"
            exit 1
          fi

      - name: Run cross-browser suite on LambdaTest
        run: mvn -B -ntp test -Plambdatest_crossbrowser -Dlt.build=gha-${{ github.run_number }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline generate target/allure-results --clean -o allure-report

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

      - name: Upload raw Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: ignore
